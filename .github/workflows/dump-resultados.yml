name: dump resultados (prod → artifact) 📥

# Herramienta manual: lee los marcadores de la BD de PRODUCCIÓN (solo lectura) y
# los sube como artifact JSON, para poder sembrarlos en una BD local de pruebas.
# NO escribe nada en prod. Se dispara a mano desde la pestaña Actions o con `gh`.
on:
  workflow_dispatch:

jobs:
  dump:
    name: leer marcadores de prod (solo lectura)
    runs-on: ubuntu-latest

    steps:
      - name: install ssh key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      # El script de dump viaja como base64 (evita comillas anidadas). En el droplet:
      # cargar nvm, entrar al repo, leer DATABASE_URL del .env y volcar (readonly) los
      # partidos que YA tienen marcador a JSON, que se redirige a resultados.json en el runner.
      - name: dump marcadores → resultados.json
        env:
          DUMP_B64: 
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "export NVM_DIR=\$HOME/.nvm && . \$NVM_DIR/nvm.sh && nvm use node >/dev/null && cd ~/code/quiniela && echo $DUMP_B64 | base64 -d | node" \
            > resultados.json
          echo "bytes:"; wc -c < resultados.json
          echo "preview:"; head -c 400 resultados.json; echo

      - name: cleanup ssh
        if: always()
        run: rm -rf ~/.ssh

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultados-prod
          path: resultados.json
          retention-days: 1
